; Name-based grouping of the game's own resource names, not a verified
; item -> model -> texture link (INFERENCE from the naming scheme):
;   W001-W011 Tal swords, W012-W022 Ailish staves, W023-W035 and W052-W070
;   Elco guns, W036-W051 Buki claws (W049 is Kazel's sword: World / Other).
;   Tal_Armour*, Ailish_LP*, Buki_V*, Elco_V* and the Merged textures are the
;   outfit/armour sets; faces, eyes, hair and hands are Body / Face.
; Only names and patterns are here; no images or extracted assets.
; First match wins, so specific sections come before the hero fallbacks.
; Unmatched textures/models are always visible under World / Other.

