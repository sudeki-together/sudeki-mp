# Private, read-only rsync daemon over NetBird.
use chroot = no
read only = yes
list = yes
max connections = 2
munge symlinks = no
hosts allow = 100.95.174.52
hosts deny = *
pid file = /home/wander/.local/state/sudekimp-sync/rsyncd.pid
lock file = /home/wander/.local/state/sudekimp-sync/rsyncd.lock
log file = /home/wander/.local/state/sudekimp-sync/rsyncd.log
transfer logging = yes
timeout = 30

[sudeki-project]
    path = /home/wander/Documents/Projects/sudeki-mp
    comment = SudekiMP source, documentation, and tooling (private)

[sudeki-game]
    path = /home/wander/Games/SudekiMP
    comment = User-owned Sudeki installation, working copy, and analysis (private)

[sudeki-research-prefix]
    path = /home/wander/Games/sudeki-research-prefix
    comment = Wine research prefix (private)

[sudeki-prefix]
    path = /home/wander/Games/sudeki-prefix
    comment = Wine game prefix (private)

[sudeki-offline-prefix]
    path = /home/wander/Games/sudeki-offline-prefix
    comment = Wine offline-install prefix (private)

[sudeki-bootstrap-prefix]
    path = /home/wander/Games/sudeki-prefix-win32-bootstrap-attempt
    comment = Wine win32 bootstrap prefix (private)
