[SudekiMP]
; Cleanroom-only developer convenience. The launcher enables this only with
; Sudeki's shipped -Level testroom path and an Ailish lead. F8 opens an
; original SudekiMP overlay that can spawn/despawn Tal, Buki, Elco, and the
; Training Dummy through native entity APIs. It is disabled for normal saves.
EnableCleanroomMenu=false
; Show the SudekiMP roster selector over the title screen and persist the
; selected P1/P2 character types for the process. Mutually exclusive with
; the cleanroom developer menu.
EnableCoopRosterMenu=true
; Developer traversal menu. F7 opens a world selector and an active-world
; temporary-interior selector. Persistent worlds use native default starts;
; interiors are rejected unless they belong to the loaded world.
EnableZoneTraversalMenu=false
; Development convenience for the title-roster prototype. This bypasses only
; Publisher.bik, ClimaxLogo.bik, and TWIMTBP.bik at runtime. Story movies and
; the user's installed files remain untouched.
SkipStartupMovies=true

; Keep disabled for vanilla behavior. When enabled on the supported build,
; the Quick Menu remains open without requesting global slow time.
EnableQuickMenuNormalSpeed=false

; Diagnostic only. When enabled on the exact supported build, logs the native
; animation/missile/damage calls made during an Elco Plasmatica skill task.
; It does not alter timing, damage, SP, animation speed, or executable files.
EnablePlasmaticaTrace=false

; Diagnostic only. Logs when Sudeki's built-in ac_QuickSkill0..5 actions reach
; the native direct-skill activation helper. It does not synthesize input or
; bypass skill validation.
EnableQuickSkillInputTrace=false

; Observation only. Logs the vanilla Prev/Next Character input event and
; before/after snapshots of party order, controller target, provisional
; control bytes, AI pointers, and actor flags. It does not select a character,
; disable AI, or change the result of the native handler.
EnableCharacterSwitchTrace=false
EnableTalosPartyPrototype=false
; Observation-only exact-build trace for the real BOSS_Talos entity. Records
; collision attempts, accepted damage, invulnerability state, reaction IDs,
; and the authored knockback-session counter without changing combat results.
EnableTalosDefenseTrace=false

; Experimental free-roam camera input. Outside combat, mouse forward/back
; changes camera distance only while [Bindings] FreeRoamCameraModifier is held.
; Mouse left/right rotation remains native. In combat all camera/input behavior
; remains vanilla. This proof does not change distance limits or camera pitch.
EnableFreeRoamCameraModifierPrototype=false

; Experimental Milestone 4 proof generalized to party ownership. The toggle
; uses Sudeki's native refcounted AI override/default functions on the first
; non-front active party member (Player 2), then restores that same character.
; It does not replace Player 1 or write an executable file.
EnableControlSeparationPrototype=false

; Observation only. Samples the unchanged world-direction, speed, turn-rate,
; and movement-mode arguments submitted by Player 1 to the controlled
; character arbiter. It does not synthesize or redirect movement.
EnablePlayerMovementTrace=false

; Experimental Phase 9 proof. Requires the control-separation module; while
; Player 2's native AI override is active, I/J/K/L submit a normalized fixed
; world-axis direction through that character's movement path. The test
; launcher temporarily moves ToggleSecondPlayerAi from J to F10 to avoid overlap.
EnableSecondPlayerMovementPrototype=false

; Experimental follow-up to the fixed-axis movement proof. Uses Sudeki's
; exact native movement-camera transform at RVA 0x000291A0 before submitting
; Player 2's direction. Requires EnableSecondPlayerMovementPrototype.
EnableSecondPlayerCameraRelativeMovementPrototype=false

; Experimental shared-camera guard. When enabled, outward Player 2 movement
; is rejected at the configured horizontal distance while inward/tangential
; movement remains available. It never teleports or moves either character.
; The value is a test starting point, not a final multiplayer balance choice.
EnableSecondPlayerSeparationGuardPrototype=false
SecondPlayerMaximumSeparation=10.0

; Experimental Phase 9 proof. Requires the control-separation module; while
; Player 2's native AI override is active, the configured rising-edge key
; submits only AttackWeak to that character's arbiter through Sudeki's unchanged combat
; validation and attack dispatch. Targeting remains native and unmodified.
EnableSecondPlayerWeakAttackPrototype=false

; Optional Linux-to-Wine Player 2 controller bridge. A native helper reads a
; Linux joydev controller and sends normalized state over UDP loopback only.
; The DLL neutralizes Player 2 input if packets stop. The left stick drives
; movement and A submits weak attack. The optional controller-camera prototype
; below consumes the right stick without altering Player 1's native mouse.
; Requires the control-separation and Player 2 movement prototypes.
EnableExternalInputBridgePrototype=false
InputBridgePort=26760
InputBridgeTimeoutMs=250
InputBridgeDeadzone=0.20

; Passive change-only diagnostic. Samples Player 2's native CTargeter while the
; AI override is active; it does not assign, clear, or replace any target.
EnableSecondPlayerTargetTrace=false

; Experimental two-player shared-camera focus. While Player 2's AI override and
; independent movement are active, Sudeki's own MatrixTarget type follows the
; midpoint between Players 1 and 2. It restores the original native target pair
; when the override ends or the engine changes camera/target state. This first
; proof changes focus only; separation-aware zoom is a later step.
EnableSharedGroupCameraPrototype=false

; Experimental render-path proof. During verified active gameplay, Sudeki first
; renders one entirely native full-size frame. After EndScene, that finished
; image is copied into left/right halves without replaying update, culling,
; shadow, visibility, or scene callbacks. Menus remain one full-width view.
; Both halves deliberately show the same camera at this checkpoint.
EnableSplitScreenRenderPrototype=false

; Experimental render-only Player 2 camera proof. Requires the finished-frame
; split compositor. It keeps Sudeki's global gameplay camera on Player 1,
; translates Player 1's valid native render matrix to the first non-front party
; member, and exposes that state only during rendering. The configured key
; toggles both diagnostic halves; simultaneous views are not implemented yet.
EnableSecondPlayerCameraPrototype=false

; Experimental first simultaneous Ailish/Buki presentation. Requires both
; render prototypes above. Sudeki still renders only once per engine frame:
; successive clean Player 1 and Player 2 frames are cached, then presented as
; Ailish-left/Buki-right. Each camera updates every other engine frame, so this
; is a cadence/latency proof rather than the final same-frame implementation.
EnableDualCameraFrameCachePrototype=false

; Experimental independent Player 2 camera input. Requires the external input
; bridge, camera-relative Player 2 movement, and the complete dual-camera stack.
; Buki's right stick orbits only her render-only camera; her left-stick movement
; then uses that same camera basis. The global gameplay camera remains Player 1's.
EnableSecondPlayerControllerCameraPrototype=false
SecondPlayerControllerCameraYawSpeed=2.25
SecondPlayerControllerCameraPitchSpeed=1.50
SecondPlayerControllerCameraMaximumPitch=0.65

; Focused ranged-character observer presentation experiment; disabled by
; default. During only Player 2's render window, expose a ranged Player 1's
; retained full-body wrapper, then restore the exact native first-person
; attachment before frame end. Player 2's own attempted first-person wrapper
; borrow is rejected after a confirmed native renderer null dereference; that
; role stays on its stable third-person camera/world wrapper. The animation
; bridge prefers the opposite authored animation bank when writing the world
; model and never advances its clock or gameplay events twice.
EnableSplitScreenRangedModelIsolationPrototype=false

; Pure Land viewport-history isolation experiment; disabled outside focused
; tests. A pending native screenshot is routed through Player 1 so its required
; callback+0x08 completion write runs unchanged. Once completion is signalled,
; Player 2 skips both the history update and motion-blur composite, preventing
; Camera 2 from contaminating the caster's global temporal texture.
EnableSpiritStrikeViewportEffectIsolationPrototype=false

; Experimental proof for Elco/Ailish top-row 5 through 0. On a readiness failure
; caused by ranged strafing, cycle Sudeki's own UI control transition and retry
; through the unchanged validator. No state bits or SP values are patched.
EnableRangedQuickSkillPrototype=false

; Integrated real-time two-player Skill Strike prototype. This deliberately
; keeps Sudeki's one shared simulation at 1.0x, gives Player 2 four native
; character-owned QuickSkill activations, rejects inputs while the one proven
; global targeting node is already owned, and routes Plasmatica's authored
; camera to its caster's cached viewport. Native cost, targeting, animation,
; damage, protection, and cleanup remain in control. This requires the launcher
; mode documented in README.md; enabling this switch alone without its
; dependencies is rejected safely.
EnableRealtimeMultiplayerSkillCombatPrototype=false

; Experimental direct Spirit Strike proof. The configured [Bindings]
; SpiritStrike key submits a resolved or diagnostic authored ID through the
; unchanged native validator and activation path.
; -1 resolves the front/controlled character and selects variant 1 or 2.
; A fixed ID from 0 through 15 remains available for diagnosis only.
EnableDirectSpiritStrikePrototype=false
SpiritStrikeId=-1
SpiritStrikeVariant=1

; Experimental and disabled by default. This changes only Elco's model
; animation multiplier while Plasmatica's ANIMID_SKILL_02 is active, then
; restores the value that was present before the cast.
EnablePlasmaticaAnimationSpeed=false
PlasmaticaAnimationSpeed=1.5

; Experimental and disabled by default. This changes the playback-rate float
; supplied to CSpiritCam::StartCam only for Plasmatica's cinematic camera.
EnablePlasmaticaCameraSpeed=false
PlasmaticaCameraSpeed=1.5

[Bindings]
; Cleanroom developer overlay. Up/Down select, Enter toggles, Escape closes.
ToggleCleanroomMenu=F8
ToggleZoneTraversalMenu=F7

; First configurable SudekiMP action. This accepts one key, not a chord.
; Letters, digits, F1-F24, arrows, navigation keys, numpad keys, common
; punctuation names, and Mouse1-Mouse5 are accepted. The external bridge maps
; only its focused Player 2 prototype; Spirit Strike remains keyboard/mouse.
SpiritStrike=G

; Rising-edge toggle for the first non-front party member's AI override.
ToggleSecondPlayerAi=J

; First independent Player 2 combat action.
SecondPlayerWeakAttack=U

; Four direct native Skill Strike slots while Player 2's AI override is active.
; These keys are rising-edge actions and accept the same names as
; the other bindings. The initial keyboard prototype leaves Player 1 on
; Sudeki's native 5-8 QuickSkill actions.
SecondPlayerSkill1=F1
SecondPlayerSkill2=F2
SecondPlayerSkill3=F3
SecondPlayerSkill4=F4

; Toggle the diagnostic native render camera between Player 1 and Player 2.
ToggleSecondPlayerCamera=F9

; Hold while moving the mouse forward/back to change free-roam distance.
FreeRoamCameraModifier=LeftCtrl
