name: Windows build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows
    steps:
      - name: Verify host build prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'git',
            'C:\msys64\usr\bin\bash.exe',
            'C:\msys64\mingw32\bin\gcc.exe',
            'C:\msys64\mingw32\bin\cmake.exe',
            'C:\msys64\mingw32\bin\ninja.exe'
          )
          $missing = @($required | Where-Object {
            if ($_ -eq 'git') {
              -not (Get-Command git -ErrorAction SilentlyContinue)
            }
            else {
              -not (Test-Path -LiteralPath $_ -PathType Leaf)
            }
          })
          if ($missing.Count -gt 0) {
            throw "Windows build prerequisites are missing: $($missing -join ', '). Install MSYS2, Git, and the MINGW32 packages documented in docs/windows-build.md."
          }

      - uses: actions/checkout@v4

      - name: Build PE32 DLL and launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MSYSTEM = 'MINGW32'
          $env:CHERE_INVOKING = '1'
          $env:PATH = 'C:\msys64\mingw32\bin;C:\msys64\usr\bin;' + $env:PATH
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE"; ./tools/build-windows.sh'
          if ($LASTEXITCODE -ne 0) {
            throw "tools/build-windows.sh failed with exit code $LASTEXITCODE"
          }

      - name: Package Windows beta
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'build\windows-mingw32\bin'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'package-stage\SudekiMP'
          $files = @(
            (Join-Path $bin 'SudekiMP.Launcher.exe'),
            (Join-Path $bin 'SudekiMP.dll'),
            (Join-Path $bin 'SudekiMP.ini'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-beta\README-Windows.txt'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-beta\SudekiMP-Beta-Launcher.ps1')
          )
          $missing = @($files | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            throw "Build completed without expected runtime files: $($missing -join ', ')"
          }
          Remove-Item -LiteralPath (Split-Path -Parent $stage) -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $bin 'SudekiMP.Launcher.exe'), (Join-Path $bin 'SudekiMP.dll'), (Join-Path $bin 'SudekiMP.ini') -Destination $stage
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-beta\README-Windows.txt'), (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-beta\SudekiMP-Beta-Launcher.ps1') -Destination $stage
          @'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0SudekiMP-Beta-Launcher.ps1"
          if errorlevel 1 pause
          '@ | Set-Content -LiteralPath (Join-Path $stage 'Launch SudekiMP.cmd') -Encoding Ascii
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'SudekiMP-Windows-Beta.zip'
          Compress-Archive -Path $stage -DestinationPath $artifact -Force

      - name: Validate Windows beta launcher script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-beta\SudekiMP-Beta-Launcher.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            throw ($errors | ForEach-Object { $_.Message } | Out-String)
          }

      - name: Upload Windows CI package
        # Gitea implements the artifact-v4 protocol but stock v4 rejects
        # non-GitHub.com servers. This maintained compatibility fork removes
        # that client-side GHES refusal.
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: SudekiMP-Windows-Beta
          path: SudekiMP-Windows-Beta.zip
          if-no-files-found: error
