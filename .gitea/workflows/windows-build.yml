name: Windows build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows
    steps:
      - name: Verify host build prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'git',
            'C:\msys64\usr\bin\bash.exe',
            'C:\msys64\mingw32\bin\gcc.exe',
            'C:\msys64\mingw32\bin\cmake.exe',
            'C:\msys64\mingw32\bin\ninja.exe'
          )
          $missing = @($required | Where-Object {
            if ($_ -eq 'git') {
              -not (Get-Command git -ErrorAction SilentlyContinue)
            }
            else {
              -not (Test-Path -LiteralPath $_ -PathType Leaf)
            }
          })
          if ($missing.Count -gt 0) {
            throw "Windows build prerequisites are missing: $($missing -join ', '). Install MSYS2, Git, and the MINGW32 packages documented in docs/windows-build.md."
          }

      - uses: actions/checkout@v4

      - name: Build PE32 DLL and launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MSYSTEM = 'MINGW32'
          $env:CHERE_INVOKING = '1'
          $env:PATH = 'C:\msys64\mingw32\bin;C:\msys64\usr\bin;' + $env:PATH
          & 'C:\msys64\usr\bin\bash.exe' -lc 'cd "$GITHUB_WORKSPACE"; ./tools/build-windows.sh'
          if ($LASTEXITCODE -ne 0) {
            throw "tools/build-windows.sh failed with exit code $LASTEXITCODE"
          }

      - name: Run expanded-encounter policy regressions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'build\windows-mingw32\bin'
          $tests = @(
            'SudekiMP.LocalViewportLayoutTest.exe',
            'SudekiMP.LocalInputHubTest.exe',
            'SudekiMP.TalosEncounterSessionTest.exe',
            'SudekiMP.TalosEncounterAdmissionTest.exe',
            'SudekiMP.TalosCompanionCarryTest.exe',
            'SudekiMP.TalosCompanionStagingTest.exe',
            'SudekiMP.TalosCompanionStagingResearchTest.exe',
            'SudekiMP.TalosCompanionMembershipAbiTest.exe',
            'SudekiMP.TalosCompanionStagingResearchAdapterTest.exe',
            'SudekiMP.TalosCompanionStagingNativeSamplerTest.exe',
            'SudekiMP.TalosCompanionStagingNativeCaptureTest.exe',
            'SudekiMP.TalosCompanionCarryAdapterTest.exe',
            'SudekiMP.TalosEncounterInterceptTest.exe',
            'SudekiMP.TalosNativeLifecycleTraceTest.exe',
            'SudekiMP.TalosPostMoviePartyRestoreTest.exe'
          )
          foreach ($test in $tests) {
            $path = Join-Path $bin $test
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing regression executable: $path"
            }
            & $path
            if ($LASTEXITCODE -ne 0) {
              throw "$test failed with exit code $LASTEXITCODE"
            }
          }

      - name: Package Windows beta
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'build\windows-mingw32\bin'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'package-stage\SudekiMP'
          $files = @(
            (Join-Path $bin 'SudekiMP.Launcher.exe'),
            (Join-Path $bin 'SudekiMP.BetaLauncher.exe'),
            (Join-Path $bin 'SudekiMP.XInputProbe.exe'),
            (Join-Path $bin 'SudekiMP.dll'),
            (Join-Path $bin 'SudekiMP.ini'),
            (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-beta\README-Windows.txt')
          )
          $missing = @($files | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            throw "Build completed without expected runtime files: $($missing -join ', ')"
          }
          Remove-Item -LiteralPath (Split-Path -Parent $stage) -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $bin 'SudekiMP.Launcher.exe'), (Join-Path $bin 'SudekiMP.BetaLauncher.exe'), (Join-Path $bin 'SudekiMP.XInputProbe.exe'), (Join-Path $bin 'SudekiMP.dll'), (Join-Path $bin 'SudekiMP.ini') -Destination $stage
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'packaging\windows-beta\README-Windows.txt') -Destination $stage
          $fixtures = Join-Path $env:GITHUB_WORKSPACE 'testdata\sudeki-saves'
          $fixtureDestination = Join-Path $stage 'CoopSaveFixtures'
          New-Item -ItemType Directory -Path $fixtureDestination -Force | Out-Null
          Copy-Item -LiteralPath (Get-ChildItem -LiteralPath $fixtures -Directory -Filter 'SAVESLOT*' | ForEach-Object { $_.FullName }) -Destination $fixtureDestination -Recurse
          @'
          @echo off
          "%~dp0SudekiMP.BetaLauncher.exe"
          if errorlevel 1 (
            echo SudekiMP Beta Launcher could not start.
            pause
          )
          '@ | Set-Content -LiteralPath (Join-Path $stage 'Launch SudekiMP.cmd') -Encoding Ascii
          $artifact = Join-Path $env:GITHUB_WORKSPACE 'SudekiMP-Windows-Beta.zip'
          Compress-Archive -Path $stage -DestinationPath $artifact -Force

      - name: Upload Windows CI package
        # Gitea implements the artifact-v4 protocol but stock v4 rejects
        # non-GitHub.com servers. This maintained compatibility fork removes
        # that client-side GHES refusal.
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: SudekiMP-Windows-Beta
          path: SudekiMP-Windows-Beta.zip
          if-no-files-found: error
